# build-emby-crx.yml - EmbyPatch2 构建（emby-crx 皮肤版）
# 触发: 仅手动（可指定官方基础版本 + 目标私有库）
# 皮肤: crx（emby-crx 全家桶：style.css + common-utils/jquery/md5/config/main.js）
# 版本策略:
#   - 手动输入版本号（如 4.9.5.0）→ 基于该版本构建
#   - 默认 latest → 自动探测官方 latest 对应版本号，打 <版本号> + latest 两个 tag
# 私有库: 可选 kulai.ainas.cc（默认）/ docker.ainas.cc:5200
name: build-emby-crx

on:
  workflow_dispatch:
    inputs:
      emby_version:
        description: '官方 Emby 基础版本（默认 latest 自动探测；可填如 4.9.5.0）'
        required: false
        default: 'latest'
        type: string
      registry:
        description: '目标私有库'
        required: true
        default: 'kulai.ainas.cc'
        type: choice
        options:
          - kulai.ainas.cc
          - docker.ainas.cc:5200

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish EmbyPatch2
        run: |
          dotnet publish tools/emby-patch2 -c Release -o patcher-bin --nologo

      - name: Detect version
        id: detect
        run: |
          INPUT_VERSION="${{ inputs.emby_version || 'latest' }}"
          VERSION="$(bash scripts/detect-version.sh "$INPUT_VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "registry=${{ inputs.registry || 'kulai.ainas.cc' }}" >> "$GITHUB_OUTPUT"
          echo ">>> 官方基础: $INPUT_VERSION → 输出 tag: $VERSION | 私有库: ${{ inputs.registry || 'kulai.ainas.cc' }} | 皮肤: crx"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.detect.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push multi-arch
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: |
            EMBY_VERSION=${{ steps.detect.outputs.base_tag }}
            SKIN=crx
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.detect.outputs.registry }}/emby/embyserver:${{ steps.detect.outputs.version }}
            ${{ steps.detect.outputs.registry }}/emby/embyserver:latest
